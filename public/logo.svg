<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" fill="none">
  <!-- PriceWise Official Logo -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&amp;display=swap');
      .pw-brand-text { font-family: 'Rubik', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .pw-tagline-text { font-family: 'Rubik', system-ui, -apple-system, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- PW Shopping Cart + Growth Arrow Icon -->
  <g transform="translate(15, 20)">
    <!-- Cart Base / Wheels -->
    <circle cx="65" cy="172" r="10" stroke="#0d9488" stroke-width="6" fill="white" />
    <circle cx="120" cy="172" r="10" stroke="#0d9488" stroke-width="6" fill="white" />

    <!-- Cart Bottom Wheel Axle -->
    <path d="M 52 148 L 132 148" stroke="#0f2b48" stroke-width="6" stroke-linecap="round" />

    <!-- P Letter & Cart Handle (Dark Navy) -->
    <path d="M 5 28 L 28 28 C 34 28 38 32 40 38 L 52 105 L 145 92" 
          stroke="#0f2b48" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- P Loop / Top Structure -->
    <path d="M 12 70 L 46 70 C 62 70 66 94 48 98 L 12 98 Z" 
          stroke="#0f2b48" stroke-width="6" stroke-linejoin="round" fill="none" />

    <!-- W Letter & Rising Arrow (Teal #0d9488) -->
    <path d="M 38 78 L 58 132 L 82 86 L 106 132 L 152 38" 
          stroke="#0d9488" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrowhead at (152, 38) pointing NE -->
    <path d="M 128 32 L 158 34 L 154 64 Z" 
          fill="#0d9488" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography: PriceWise -->
  <g transform="translate(200, 105)">
    <text x="0" y="0" class="pw-brand-text" font-size="52" fill="#0f2b48" letter-spacing="-1">PriceWise</text>
  </g>

  <!-- Brand Tagline: חיסכון משתלם זה אנחנו. -->
  <g transform="translate(400, 142)" text-anchor="end">
    <text x="0" y="0" class="pw-tagline-text" font-size="22" fill="#0f2b48" letter-spacing="-0.3">חיסכון משתלם</text>
    <text x="0" y="26" class="pw-tagline-text" font-size="22" fill="#0f2b48" letter-spacing="-0.3">זה אנחנו.</text>
  </g>
</svg>
